name: vilar_legal_os_v60
description: VILAR Legal OS v60 — Artifact Factory
publish_to: none
version: 60.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # HTTP + SSE
  dio: ^5.4.3
  http: ^1.2.1
  eventsource: ^0.4.0

  # UI
  flutter_markdown: ^0.7.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Files
  file_picker: ^8.0.3
  open_file: ^3.3.2
  path_provider: ^2.1.3
  path: ^1.9.0

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
