<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VILAR Legal OS v59</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--sidebar:#161b27;--panel:#1a2035;--border:#2a3352;
  --accent:#4f8ef7;--accent2:#7c5cbf;--green:#34d399;--red:#f87171;
  --yellow:#fbbf24;--text:#e2e8f0;--muted:#6b7280;--hover:#202840;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* ── Header ── */
#header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--sidebar);border-bottom:1px solid var(--border);flex-shrink:0;z-index:10}
#header h1{font-size:1.1rem;font-weight:700;letter-spacing:.5px;color:var(--accent)}
#header h1 span{color:var(--muted);font-weight:400;font-size:.85rem;margin-left:8px}
#case-selector{display:flex;align-items:center;gap:8px}
#case-selector select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:.85rem;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:.82rem;cursor:pointer;font-weight:600;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-sm{padding:4px 10px;font-size:.78rem}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);opacity:1}
.btn-danger{background:var(--red)}
#health-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
#health-dot.ok{background:var(--green)}
#health-dot.err{background:var(--red)}

/* ── Main layout ── */
#main{display:flex;flex:1;overflow:hidden}

/* ── Left sidebar — Artifacts ── */
#sidebar{width:300px;min-width:240px;max-width:400px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;resize:horizontal;overflow:hidden}
#sidebar-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#sidebar-header h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
#artifact-tabs{display:flex;gap:4px;padding:8px 10px;flex-shrink:0;border-bottom:1px solid var(--border)}
.atab{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:4px 0;font-size:.75rem;cursor:pointer;text-align:center;transition:all .15s}
.atab.active{background:var(--accent);border-color:var(--accent);color:#fff}
#artifact-list{flex:1;overflow-y:auto;padding:6px}
.artifact-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background .15s;border:1px solid transparent;margin-bottom:3px}
.artifact-item:hover{background:var(--hover)}
.artifact-item.selected{background:var(--hover);border-color:var(--accent)}
.artifact-item.in-ctx{border-left:3px solid var(--accent)}
.artifact-icon{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0}
.icon-pdf{background:#fde68a22;color:#fbbf24}
.icon-img{background:#bbf7d022;color:#34d399}
.icon-doc{background:#bfdbfe22;color:#93c5fd}
.icon-txt{background:#e9d5ff22;color:#c084fc}
.icon-sys{background:#f0abfc22;color:#e879f9}
.artifact-info{flex:1;min-width:0}
.artifact-name{font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.artifact-meta{font-size:.68rem;color:var(--muted);margin-top:1px}
.artifact-cb{width:14px;height:14px;accent-color:var(--accent);flex-shrink:0}
#artifact-actions{padding:8px 10px;border-top:1px solid var(--border);display:flex;gap:6px;flex-shrink:0}
#upload-drop{border:2px dashed var(--border);border-radius:8px;padding:10px;text-align:center;font-size:.75rem;color:var(--muted);cursor:pointer;transition:all .15s;margin:6px 10px;flex-shrink:0}
#upload-drop:hover,#upload-drop.drag{border-color:var(--accent);color:var(--accent);background:var(--hover)}
#upload-input{display:none}
#ctx-counter{font-size:.72rem;color:var(--accent);white-space:nowrap}

/* ── Center — Chat ── */
#chat-panel{flex:1;display:flex;flex-direction:column;min-width:0}
#chat-header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--panel)}
#chat-header h2{font-size:.85rem;font-weight:600;color:var(--text)}
#chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:100%}
.msg.user{flex-direction:row-reverse}
.msg-bubble{padding:10px 14px;border-radius:10px;font-size:.85rem;line-height:1.55;max-width:75%;word-wrap:break-word;white-space:pre-wrap}
.msg.assistant .msg-bubble{background:var(--panel);border:1px solid var(--border)}
.msg.user .msg-bubble{background:var(--accent);color:#fff}
.msg-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;margin-top:2px}
.msg.assistant .msg-avatar{background:var(--accent2)}
.msg.user .msg-avatar{background:var(--accent)}
.msg-time{font-size:.65rem;color:var(--muted);margin-top:4px;display:block}
.thinking{display:flex;gap:4px;padding:10px 14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;width:fit-content}
.thinking span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite}
.thinking span:nth-child(2){animation-delay:.2s}
.thinking span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}
#chat-input-area{padding:12px 16px;border-top:1px solid var(--border);background:var(--panel);flex-shrink:0}
#ctx-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;min-height:0}
.ctx-chip{background:var(--accent);color:#fff;border-radius:4px;padding:2px 8px;font-size:.7rem;display:flex;align-items:center;gap:4px;cursor:default}
.ctx-chip button{background:none;border:none;color:#fff;cursor:pointer;font-size:.8rem;line-height:1;padding:0}
#chat-form{display:flex;gap:8px}
#chat-input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 13px;font-size:.85rem;resize:none;min-height:42px;max-height:120px;outline:none;font-family:inherit;transition:border-color .15s}
#chat-input:focus{border-color:var(--accent)}
#send-btn{padding:9px 16px;font-size:.85rem}

/* ── Right panel — Viewer ── */
#viewer-panel{width:380px;min-width:280px;background:var(--sidebar);border-left:1px solid var(--border);display:flex;flex-direction:column}
#viewer-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#viewer-header h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
#viewer-content{flex:1;overflow-y:auto;padding:14px;font-size:.78rem;line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
#viewer-content.empty{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;font-style:italic}
#viewer-content img{max-width:100%;border-radius:6px;margin:4px 0}
.viewer-filename{font-size:.7rem;color:var(--accent);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:#0009;z-index:100;display:flex;align-items:center;justify-content:center}
.modal-overlay.hidden{display:none}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;width:480px;max-width:90vw;max-height:85vh;overflow-y:auto}
.modal h3{font-size:1rem;margin-bottom:16px;color:var(--accent)}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:.83rem;outline:none;font-family:inherit}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--accent)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;right:24px;padding:10px 18px;border-radius:8px;font-size:.82rem;font-weight:600;z-index:200;transform:translateY(20px);opacity:0;transition:all .2s;pointer-events:none}
#toast.show{transform:translateY(0);opacity:1}
#toast.success{background:var(--green);color:#000}
#toast.error{background:var(--red);color:#fff}
#toast.info{background:var(--accent);color:#fff}

/* ── Upload progress ── */
#upload-progress{display:none;position:fixed;bottom:70px;right:24px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:.78rem;z-index:200;min-width:240px}
.progress-bar-wrap{background:var(--bg);border-radius:4px;height:6px;margin-top:6px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);width:0;transition:width .3s;border-radius:4px}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Responsive: hide viewer on narrow screens ── */
@media(max-width:900px){#viewer-panel{display:none}}
@media(max-width:640px){#sidebar{width:220px}}
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div style="display:flex;align-items:center;gap:12px">
    <div id="health-dot" title="API status"></div>
    <h1>VILAR Legal OS <span>v59</span></h1>
  </div>
  <div id="case-selector">
    <select id="case-select">
      <option value="">— Seleccionar expediente —</option>
    </select>
    <button class="btn btn-sm" onclick="openNewCaseModal()">+ Expediente</button>
  </div>
</div>

<!-- Main -->
<div id="main">

  <!-- Left sidebar: Artifacts -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h2>Archivos</h2>
      <span id="ctx-counter">0 en contexto</span>
    </div>
    <div id="artifact-tabs">
      <button class="atab active" data-tab="user" onclick="switchArtifactTab('user')">Subidos</button>
      <button class="atab" data-tab="system" onclick="switchArtifactTab('system')">Generados</button>
    </div>
    <div id="artifact-list"></div>
    <label id="upload-drop" for="upload-input">
      <div>📎 Arrastra archivos o haz clic</div>
      <div style="font-size:.68rem;margin-top:3px">PDF · JPG · PNG · DOCX · TXT</div>
    </label>
    <input type="file" id="upload-input" multiple accept=".pdf,.jpg,.jpeg,.png,.docx,.txt,.doc">
    <div id="artifact-actions">
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="selectAllArtifacts()">Todos al ctx</button>
      <button class="btn btn-ghost btn-sm" style="flex:1" onclick="clearContext()">Limpiar ctx</button>
    </div>
  </div>

  <!-- Center: Chat -->
  <div id="chat-panel">
    <div id="chat-header">
      <h2 id="chat-case-title">VILAR Legal OS v59</h2>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" onclick="clearHistory()">Limpiar historial</button>
      </div>
    </div>
    <div id="chat-messages">
      <div class="msg assistant">
        <div class="msg-avatar">AI</div>
        <div>
          <div class="msg-bubble">
            Bienvenido a VILAR Legal OS v59. Sube documentos y úsalos como contexto para el análisis jurídico con Claude.
          </div>
        </div>
      </div>
    </div>
    <div id="chat-input-area">
      <div id="ctx-chips"></div>
      <form id="chat-form" onsubmit="sendMessage(event)">
        <textarea id="chat-input" placeholder="Escribe un mensaje... (Enter envía, Shift+Enter nueva línea)" rows="1"></textarea>
        <button type="submit" id="send-btn" class="btn">Enviar</button>
      </form>
    </div>
  </div>

  <!-- Right: Viewer -->
  <div id="viewer-panel">
    <div id="viewer-header">
      <h2>Visor</h2>
      <button class="btn btn-ghost btn-sm" onclick="clearViewer()">✕</button>
    </div>
    <div id="viewer-content" class="empty">Selecciona un archivo para visualizarlo</div>
  </div>

</div>

<!-- Modal: new case -->
<div class="modal-overlay hidden" id="case-modal">
  <div class="modal">
    <h3>Nuevo Expediente</h3>
    <div class="form-row">
      <label>Nombre del expediente *</label>
      <input type="text" id="nc-name" placeholder="Ej. García vs. Martínez">
    </div>
    <div class="form-row">
      <label>Tipo de materia</label>
      <select id="nc-type">
        <option value="civil">Civil</option>
        <option value="penal">Penal</option>
        <option value="laboral">Laboral</option>
        <option value="familiar">Familiar</option>
        <option value="administrativo">Administrativo</option>
        <option value="mercantil">Mercantil</option>
        <option value="general" selected>General</option>
      </select>
    </div>
    <div class="form-row">
      <label>Cliente</label>
      <input type="text" id="nc-client" placeholder="Nombre del cliente">
    </div>
    <div class="form-row">
      <label>Email del cliente</label>
      <input type="email" id="nc-email" placeholder="cliente@email.com">
    </div>
    <div class="form-row">
      <label>Notas</label>
      <textarea id="nc-notes" rows="3" placeholder="Notas iniciales..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('case-modal')">Cancelar</button>
      <button class="btn" onclick="createCase()">Crear Expediente</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Upload progress -->
<div id="upload-progress">
  <div id="upload-progress-text">Subiendo...</div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="upload-bar"></div></div>
</div>

<script>
// ── State ─────────────────────────────────────────────────
const API = '/api';
let currentCase = null;
let artifacts = {user: [], system: []};
let ctxIds = new Set();        // artifact IDs selected for context
let artifactTab = 'user';
let chatHistory = [];

// ── Init ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  healthCheck();
  loadCases();
  setupUpload();
  autoResizeTextarea();
  setInterval(healthCheck, 30000);
});

// ── Health ────────────────────────────────────────────────
async function healthCheck() {
  try {
    const r = await fetch(`${API}/health`);
    const dot = document.getElementById('health-dot');
    dot.className = r.ok ? 'ok' : 'err';
  } catch {
    document.getElementById('health-dot').className = 'err';
  }
}

// ── Cases ─────────────────────────────────────────────────
async function loadCases() {
  try {
    const r = await fetch(`${API}/cases`);
    const data = await r.json();
    const sel = document.getElementById('case-select');
    sel.innerHTML = '<option value="">— Seleccionar expediente —</option>';
    (data.cases || []).forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.case_id;
      opt.textContent = c.case_name;
      sel.appendChild(opt);
    });
    sel.onchange = () => selectCase(sel.value);
  } catch(e) {
    toast('Error al cargar expedientes', 'error');
  }
}

async function selectCase(id) {
  if (!id) { currentCase = null; return; }
  try {
    const r = await fetch(`${API}/cases/${id}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    if (!data.case) throw new Error('Respuesta inesperada del servidor');
    currentCase = data.case;
    document.getElementById('chat-case-title').textContent = currentCase.case_name;
    ctxIds.clear();
    chatHistory = [];
    renderCtxChips();
    await loadArtifacts();
    await loadChatHistory();
  } catch(e) {
    console.error('selectCase:', e);
    toast('Error al cargar expediente: ' + e.message, 'error');
  }
}

function openNewCaseModal() { document.getElementById('case-modal').classList.remove('hidden'); }

async function createCase() {
  const name = document.getElementById('nc-name').value.trim();
  if (!name) { toast('El nombre es requerido', 'error'); return; }
  const body = {
    case_name: name,
    matter_type: document.getElementById('nc-type').value,
    client_name: document.getElementById('nc-client').value,
    client_email: document.getElementById('nc-email').value,
    notes: document.getElementById('nc-notes').value
  };
  try {
    const r = await fetch(`${API}/cases`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Error');
    closeModal('case-modal');
    toast('Expediente creado', 'success');
    await loadCases();
    const sel = document.getElementById('case-select');
    sel.value = data.case_id;
    await selectCase(data.case_id);
  } catch(e) {
    toast(e.message, 'error');
  }
}

// ── Artifacts ─────────────────────────────────────────────
async function loadArtifacts() {
  if (!currentCase) return;
  try {
    const r = await fetch(`${API}/artifacts/${currentCase.case_id}`);
    const data = await r.json();
    artifacts.user = (data.artifacts || []).filter(a => a.source === 'user');
    artifacts.system = (data.artifacts || []).filter(a => a.source === 'system');
    renderArtifacts();
  } catch(e) {
    console.error('loadArtifacts:', e);
  }
}

function switchArtifactTab(tab) {
  artifactTab = tab;
  document.querySelectorAll('.atab').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  renderArtifacts();
}

function renderArtifacts() {
  const list = document.getElementById('artifact-list');
  const items = artifacts[artifactTab] || [];
  if (!items.length) {
    list.innerHTML = `<div style="text-align:center;color:var(--muted);font-size:.78rem;padding:20px">${artifactTab === 'user' ? 'Sin archivos subidos' : 'Sin archivos generados'}</div>`;
    return;
  }
  list.innerHTML = items.map(a => {
    const inCtx = ctxIds.has(a.artifact_id);
    return `<div class="artifact-item${inCtx ? ' in-ctx' : ''}" id="ai-${a.artifact_id}">
      <input type="checkbox" class="artifact-cb" ${inCtx ? 'checked' : ''} onchange="toggleCtx('${a.artifact_id}',this.checked)">
      <div class="artifact-icon ${iconClass(a)}">${iconEmoji(a)}</div>
      <div class="artifact-info" onclick="viewArtifact('${a.artifact_id}')" style="cursor:pointer">
        <div class="artifact-name" title="${esc(a.filename||a.artifact_name||'')}">
          ${esc(a.filename||a.artifact_name||'Archivo')}
        </div>
        <div class="artifact-meta">${a.mime_type||''} · ${fmtSize(a.file_size_bytes)}</div>
      </div>
      <button style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:.8rem"
        onclick="deleteArtifact('${a.artifact_id}')" title="Eliminar">✕</button>
    </div>`;
  }).join('');
  updateCtxCounter();
}

function iconClass(a) {
  const m = a.mime_type || '';
  if (m.includes('pdf')) return 'icon-pdf';
  if (m.includes('image')) return 'icon-img';
  if (m.includes('word') || m.includes('docx')) return 'icon-doc';
  if (a.source === 'system') return 'icon-sys';
  return 'icon-txt';
}
function iconEmoji(a) {
  const m = a.mime_type || '';
  if (m.includes('pdf')) return '📄';
  if (m.includes('image')) return '🖼';
  if (m.includes('word') || m.includes('docx')) return '📝';
  if (a.source === 'system') return '🤖';
  return '📃';
}
function fmtSize(b) {
  if (!b) return '';
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}

function toggleCtx(id, checked) {
  if (checked) ctxIds.add(id); else ctxIds.delete(id);
  const el = document.getElementById(`ai-${id}`);
  if (el) el.classList.toggle('in-ctx', checked);
  renderCtxChips();
  updateCtxCounter();
}

function selectAllArtifacts() {
  (artifacts[artifactTab] || []).forEach(a => ctxIds.add(a.artifact_id));
  renderArtifacts();
  renderCtxChips();
}

function clearContext() {
  ctxIds.clear();
  renderArtifacts();
  renderCtxChips();
}

function renderCtxChips() {
  const all = [...artifacts.user, ...artifacts.system];
  const chips = document.getElementById('ctx-chips');
  chips.innerHTML = [...ctxIds].map(id => {
    const a = all.find(x => x.artifact_id === id);
    const name = a ? (a.filename || a.artifact_name || id) : id;
    return `<div class="ctx-chip">${esc(name.substring(0,22))} <button onclick="toggleCtx('${id}',false)">✕</button></div>`;
  }).join('');
}

function updateCtxCounter() {
  document.getElementById('ctx-counter').textContent = `${ctxIds.size} en contexto`;
}

async function viewArtifact(id) {
  const all = [...artifacts.user, ...artifacts.system];
  const a = all.find(x => x.artifact_id === id);
  if (!a) return;
  const vc = document.getElementById('viewer-content');
  vc.className = '';
  const name = a.filename || a.artifact_name || 'Archivo';
  const header = `<div class="viewer-filename"><span>${esc(name)}</span><span>${fmtSize(a.file_size_bytes)}</span></div>`;

  if (a.mime_type && a.mime_type.includes('image')) {
    vc.innerHTML = header + `<img src="${API}/artifacts/file/${id}" alt="${esc(name)}">`;
    return;
  }
  if (a.source === 'system' && a.content) {
    vc.innerHTML = header + esc(a.content);
    return;
  }
  if (a.extracted_text) {
    vc.innerHTML = header + esc(a.extracted_text);
    return;
  }
  // fetch text
  try {
    const r = await fetch(`${API}/artifacts/${id}/text`);
    const d = await r.json();
    vc.innerHTML = header + esc(d.text || '(Sin texto extraído)');
  } catch {
    vc.innerHTML = header + '(No disponible)';
  }
}

async function deleteArtifact(id) {
  if (!confirm('¿Eliminar este archivo?')) return;
  try {
    const r = await fetch(`${API}/artifacts/${id}`, {method:'DELETE'});
    if (!r.ok) throw new Error();
    ctxIds.delete(id);
    await loadArtifacts();
    renderCtxChips();
    toast('Archivo eliminado', 'success');
  } catch {
    toast('Error al eliminar', 'error');
  }
}

function clearViewer() {
  const vc = document.getElementById('viewer-content');
  vc.className = 'empty';
  vc.textContent = 'Selecciona un archivo para visualizarlo';
}

// ── Upload ────────────────────────────────────────────────
function setupUpload() {
  const drop = document.getElementById('upload-drop');
  const inp = document.getElementById('upload-input');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', e => {
    e.preventDefault();
    drop.classList.remove('drag');
    if (e.dataTransfer.files.length) uploadFiles(e.dataTransfer.files);
  });
  inp.addEventListener('change', () => { if (inp.files.length) uploadFiles(inp.files); inp.value = ''; });
}

async function uploadFiles(files) {
  if (!currentCase) { toast('Selecciona un expediente primero', 'error'); return; }
  const prog = document.getElementById('upload-progress');
  const bar = document.getElementById('upload-bar');
  const txt = document.getElementById('upload-progress-text');
  prog.style.display = 'block';
  let done = 0;
  for (const file of files) {
    txt.textContent = `Subiendo ${file.name}…`;
    bar.style.width = Math.round((done / files.length) * 100) + '%';
    const fd = new FormData();
    fd.append('file', file);
    fd.append('case_id', currentCase.case_id);
    try {
      const r = await fetch(`${API}/upload`, {method:'POST', body: fd});
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Error');
    } catch(e) {
      toast(`Error: ${e.message}`, 'error');
    }
    done++;
  }
  bar.style.width = '100%';
  setTimeout(() => { prog.style.display = 'none'; bar.style.width = '0'; }, 800);
  await loadArtifacts();
  toast(`${done} archivo(s) subido(s)`, 'success');
}

// ── Chat ──────────────────────────────────────────────────
async function loadChatHistory() {
  if (!currentCase) return;
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML = '';
  chatHistory = [];
  try {
    const r = await fetch(`${API}/chat/history/${currentCase.case_id}`);
    const data = await r.json();
    (data.history || []).forEach(m => {
      chatHistory.push({role: m.role, content: m.content});
      appendMessage(m.role, m.content, m.created_at);
    });
    scrollChat();
  } catch(e) {
    console.error('loadChatHistory:', e);
  }
}

async function sendMessage(e) {
  e.preventDefault();
  const inp = document.getElementById('chat-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  inp.style.height = 'auto';

  appendMessage('user', text);
  chatHistory.push({role:'user', content: text});
  scrollChat();

  const thinking = document.createElement('div');
  thinking.className = 'msg assistant';
  thinking.innerHTML = '<div class="msg-avatar">AI</div><div class="thinking"><span></span><span></span><span></span></div>';
  document.getElementById('chat-messages').appendChild(thinking);
  scrollChat();

  try {
    const r = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        case_id: currentCase ? currentCase.case_id : '',
        message: text,
        context_artifact_ids: [...ctxIds],
        history: chatHistory.slice(-20)
      })
    });
    const data = await r.json();
    thinking.remove();
    if (!r.ok) throw new Error(data.error || 'Error');
    const reply = data.response || data.message || '(sin respuesta)';
    appendMessage('assistant', reply);
    chatHistory.push({role:'assistant', content: reply});
    if (data.artifact_id) {
      await loadArtifacts();
      toast('Análisis guardado como artefacto', 'info');
    }
    scrollChat();
  } catch(err) {
    thinking.remove();
    appendMessage('assistant', `Error: ${err.message}`);
    scrollChat();
  }
}

function appendMessage(role, content, ts) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const time = ts ? new Date(ts).toLocaleTimeString('es-MX', {hour:'2-digit',minute:'2-digit'}) :
    new Date().toLocaleTimeString('es-MX', {hour:'2-digit',minute:'2-digit'});
  div.innerHTML = `
    <div class="msg-avatar">${role === 'user' ? 'Tú' : 'AI'}</div>
    <div>
      <div class="msg-bubble">${role === 'assistant' ? mdToHtml(content) : esc(content)}</div>
      <span class="msg-time">${time}</span>
    </div>`;
  msgs.appendChild(div);
}

function scrollChat() {
  const msgs = document.getElementById('chat-messages');
  msgs.scrollTop = msgs.scrollHeight;
}

async function clearHistory() {
  if (!currentCase) return;
  if (!confirm('¿Limpiar el historial de chat?')) return;
  try {
    await fetch(`${API}/chat/history/${currentCase.case_id}`, {method:'DELETE'});
    chatHistory = [];
    document.getElementById('chat-messages').innerHTML = '';
    toast('Historial limpiado', 'success');
  } catch {
    toast('Error al limpiar historial', 'error');
  }
}

// ── Helpers ───────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mdToHtml(s) {
  // Very minimal markdown: bold, code, newlines
  return esc(s)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code style="background:var(--bg);padding:1px 5px;border-radius:3px;font-size:.82em">$1</code>')
    .replace(/\n/g, '<br>');
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

let toastTimer;
function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

function autoResizeTextarea() {
  const ta = document.getElementById('chat-input');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('chat-form').dispatchEvent(new Event('submit', {cancelable:true}));
    }
  });
}

// Close modals on overlay click
document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.add('hidden'); });
});
</script>
