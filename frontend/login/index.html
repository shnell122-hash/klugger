<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ia.vilarkptl — Acceso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d0d0d;
      --bg2:     #141414;
      --bg3:     #1c1c1c;
      --border:  #2a2a2a;
      --accent:  #00c8ff;
      --text:    #e8e8e8;
      --muted:   #666;
      --red:     #ff4c4c;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'SF Mono', 'Fira Code', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 36px 32px;
      width: 320px;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .logo span { color: var(--muted); font-weight: 400; }

    .subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="password"] {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: var(--accent); }

    button {
      width: 100%;
      margin-top: 16px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 11px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover  { opacity: 0.85; }
    button:active { opacity: 0.7; }

    .error {
      margin-top: 14px;
      padding: 9px 12px;
      background: rgba(255,76,76,0.12);
      border: 1px solid rgba(255,76,76,0.3);
      border-radius: 4px;
      font-size: 12px;
      color: var(--red);
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">ia<span>.vilarkptl.com</span></div>
    <div class="subtitle">AI Monitor — acceso restringido</div>

    <label for="pwd">Contraseña</label>
    <input type="password" id="pwd" autofocus placeholder="••••••••••••">
    <button id="btn-login">Entrar</button>
    <div class="error" id="err-msg"></div>
  </div>

  <script>
    const btn  = document.getElementById('btn-login');
    const pwd  = document.getElementById('pwd');
    const err  = document.getElementById('err-msg');

    async function doLogin() {
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Verificando…';
      try {
        const res = await fetch('/api/auth/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ password: pwd.value }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/';
        } else {
          err.textContent = data.error || 'Error de autenticación';
          err.style.display = 'block';
          pwd.value = '';
          pwd.focus();
        }
      } catch (e) {
        err.textContent = 'Error de red — ' + e.message;
        err.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }

    btn.addEventListener('click', doLogin);
    pwd.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
