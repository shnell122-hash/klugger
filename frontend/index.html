<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ia.vilarkptl — AI Monitor</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="logo">ia<span>.vilarkptl.com</span></div>

  <div class="stat-pill">
    <span class="label">Hoy</span>
    <span class="value cost" id="stat-cost">$0.00000</span>
  </div>
  <div class="stat-pill">
    <span class="label">Activas</span>
    <span class="value active" id="stat-active">0</span>
  </div>
  <div class="stat-pill">
    <span class="label">Eventos</span>
    <span class="value" id="stat-events">0</span>
  </div>

  <div class="header-right">
    <div class="conn-dot" id="conn-dot"></div>
    <span style="color:var(--text-muted);font-size:10px">live</span>
  </div>
</header>

<!-- ── Mobile tab bar ── -->
<div id="tab-bar">
  <button class="tab-btn active" data-panel="feed">Feed</button>
  <button class="tab-btn" data-panel="agents">Agentes</button>
  <button class="tab-btn" data-panel="screenshots">Screenshots</button>
  <button class="tab-btn" data-panel="sessions">Sesiones</button>
  <button class="tab-btn" data-panel="costs">Costos</button>
  <button class="tab-btn" data-panel="providers">APIs</button>
  <button class="tab-btn" data-panel="projects">Proyectos</button>
</div>

<!-- ── Main ── -->
<main>

  <!-- Left: Live event feed -->
  <div id="feed-panel" class="mobile-active">
    <div class="panel-header">
      <span class="title">Tool calls en vivo</span>
      <span id="feed-count" style="color:var(--text-muted)">0 eventos</span>
    </div>
    <div id="event-list"></div>
  </div>

  <!-- Right panel -->
  <div id="right-panel">

    <!-- Desktop tabs -->
    <div id="right-tabs">
      <button class="rtab active" data-rtab="agents">Agentes</button>
      <button class="rtab" data-rtab="screenshots">Screenshots</button>
      <button class="rtab" data-rtab="sessions">Sesiones</button>
      <button class="rtab" data-rtab="costs">Costos</button>
      <button class="rtab" data-rtab="providers">APIs</button>
      <button class="rtab" data-rtab="projects">Proyectos</button>
    </div>

    <!-- Agents / Dispatch Queue -->
    <div id="agents-panel" class="visible">
      <div class="panel-header">
        <span class="title">Cola de tareas</span>
        <span id="agents-count" style="color:var(--text-muted)">—</span>
      </div>
      <div id="dispatch-list"></div>
    </div>

    <!-- Screenshots -->
    <div id="screenshots-panel">
      <div class="panel-header">
        <span class="title">Screenshots</span>
        <div style="display:flex;gap:6px;align-items:center">
          <select id="shot-filter" style="background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:2px 6px;font-size:10px">
            <option value="">Todos los proyectos</option>
          </select>
          <span id="shot-count" style="color:var(--text-muted)">—</span>
        </div>
      </div>
      <div id="screenshot-grid"></div>
    </div>

    <!-- Sessions -->
    <div id="sessions-panel">
      <div id="session-list"></div>
    </div>

    <!-- Costs -->
    <div id="costs-panel">
      <div class="cost-section">
        <h3>Hoy</h3>
        <div class="cost-row"><span class="label">Total USD</span><span class="val" id="cost-today">—</span></div>
        <div class="cost-row"><span class="label">Sesiones</span><span class="val" id="cost-today-sessions">—</span></div>
        <div class="cost-row"><span class="label">Eventos</span><span class="val" id="cost-today-events">—</span></div>
      </div>
      <div class="cost-section">
        <h3>Esta semana</h3>
        <div class="cost-row"><span class="label">Total USD</span><span class="val" id="cost-week">—</span></div>
        <div class="cost-row"><span class="label">Sesiones</span><span class="val" id="cost-week-sessions">—</span></div>
      </div>
      <div class="chart-container">
        <h3>Costo últimas 24h</h3>
        <div class="chart-wrapper">
          <canvas id="cost-chart-line"></canvas>
        </div>
      </div>
      <div class="cost-section">
        <h3>Por tool (24h)</h3>
        <div id="cost-by-tool"></div>
      </div>
    </div>

    <!-- Providers / API Keys -->
    <div id="providers-panel">
      <div id="add-provider-form">
        <h3>Agregar API Key</h3>
        <div class="form-row">
          <label>Proveedor</label>
          <select id="fp-provider">
            <option value="anthropic">Anthropic (Claude)</option>
            <option value="openai">OpenAI</option>
            <option value="deepseek">DeepSeek</option>
            <option value="fal">FAL.ai</option>
            <option value="elevenlabs">ElevenLabs</option>
          </select>
        </div>
        <div class="form-row">
          <label>Proyecto</label>
          <input type="text" id="fp-project" placeholder="FiscalAI, DeCabeceraTax…">
        </div>
        <div class="form-row">
          <label>API Key (solo guardamos últimos 6 chars)</label>
          <input type="password" id="fp-key" placeholder="sk-…">
        </div>
        <div class="form-row">
          <label>Límite mensual USD (0 = sin límite)</label>
          <input type="number" id="fp-limit" placeholder="0" step="1" min="0">
        </div>
        <button class="btn-primary" id="fp-save">Guardar</button>
      </div>
      <div id="provider-list"></div>
    </div>

    <!-- Projects / Screenshots -->
    <div id="projects-panel">
      <div id="project-list"></div>
    </div>

  </div>
</main>

<!-- ── Project detail modal ── -->
<div id="project-detail-modal">
  <div class="pdm-box">
    <div class="pdm-header">
      <div class="pdm-title" id="pdm-name">—</div>
      <a class="pdm-url" id="pdm-url" href="#" target="_blank"></a>
      <button class="pdm-close" id="pdm-close">✕</button>
    </div>
    <div class="pdm-tabs">
      <button class="pdm-tab active" data-pdm-tab="journal">Historial</button>
      <button class="pdm-tab" data-pdm-tab="context">Contexto</button>
      <button class="pdm-tab" data-pdm-tab="costs">Costos</button>
    </div>
    <div class="pdm-body">
      <div id="pdm-journal-tab"></div>
      <div id="pdm-context-tab" style="display:none"></div>
      <div id="pdm-costs-tab"   style="display:none"></div>
    </div>
  </div>
</div>

<script src="/js/dashboard.js"></script>
</body>
</html>
