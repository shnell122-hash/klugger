# Apache virtual host config for ia.vilarkptl.com
# Place in: /etc/apache2/sites-available/ia.vilarkptl.com.conf
# Enable:   a2ensite ia.vilarkptl.com && systemctl reload apache2
# SSL:      certbot --apache -d ia.vilarkptl.com
#
# NOTE: No DocumentRoot — all traffic proxied to Node.js :3010 so the
# express-session auth check in server.js intercepts requests to /.

<VirtualHost *:80>
    ServerName ia.vilarkptl.com

    ProxyPreserveHost On
    RewriteEngine On

    # Socket.io WebSocket — requires mod_proxy_wstunnel
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/socket\.io/(.*)$ ws://127.0.0.1:3010/socket.io/$1 [P,L]

    # exec-lite (systemd, port 3099) — independent from ai-monitor, always up
    # Used by Claude Code agents when /api/exec (ai-monitor) is down
    ProxyPass        /exec-lite http://127.0.0.1:3099/
    ProxyPassReverse /exec-lite http://127.0.0.1:3099/

    # Relay Dashboard (Next.js, port 3030) — must come BEFORE the catch-all /
    ProxyPass        /dash http://127.0.0.1:3030/dash
    ProxyPassReverse /dash http://127.0.0.1:3030/dash

    # Main backend (Express + Socket.io, port 3010)
    ProxyPass        /socket.io/ http://127.0.0.1:3010/socket.io/
    ProxyPassReverse /socket.io/ http://127.0.0.1:3010/socket.io/
    ProxyPass        / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/

    ErrorLog  /var/log/apache2/ai-monitor-error.log
    CustomLog /var/log/apache2/ai-monitor-access.log combined
</VirtualHost>
