<VirtualHost *:80>
    ServerName flujos.fiscalai.mx
    # Redirigir todo HTTP → HTTPS
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName flujos.fiscalai.mx

    # SSL — ajustar rutas si se usa certbot/Let's Encrypt
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/flujos.fiscalai.mx/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/flujos.fiscalai.mx/privkey.pem

    # Logs
    ErrorLog  /var/log/apache2/flujos-fiscalai-error.log
    CustomLog /var/log/apache2/flujos-fiscalai-access.log combined

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Proxy al dashboard Next.js (puerto 3020)
    ProxyPreserveHost On
    ProxyRequests     Off

    # Next.js — todas las rutas
    ProxyPass        / http://127.0.0.1:3020/
    ProxyPassReverse / http://127.0.0.1:3020/

    # Next.js WebSocket (HMR en dev, no necesario en prod pero no daña)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3020/$1 [P,L]

    # Cache de assets estáticos de Next.js
    <LocationMatch "^/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</VirtualHost>
