# VirtualHost HTTP — certbot --apache lo convierte a HTTPS automáticamente
# Instalación:
#   cp deploy/apache/flujos.fiscalai.mx.conf /etc/apache2/sites-available/
#   a2enmod proxy proxy_http
#   a2ensite flujos.fiscalai.mx.conf
#   apache2ctl configtest && systemctl reload apache2
#   certbot --apache -d flujos.fiscalai.mx   ← esto crea el bloque 443 solo

<VirtualHost *:80>
    ServerName flujos.fiscalai.mx

    # Proxy al dashboard Next.js (puerto 3020)
    # Puerto 3010 ya lo usa ai-monitor (backend Express)
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3020/
    ProxyPassReverse / http://127.0.0.1:3020/

    ErrorLog  ${APACHE_LOG_DIR}/flujos-fiscalai-error.log
    CustomLog ${APACHE_LOG_DIR}/flujos-fiscalai-access.log combined
</VirtualHost>
