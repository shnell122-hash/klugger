# Apache VirtualHost config for ocr.ruby.lease
# Place in: /etc/apache2/sites-available/ocr.ruby.lease-le-ssl.conf
# Enable:   a2ensite ocr.ruby.lease-le-ssl && systemctl reload apache2
#
# IMPORTANT: This file is the source of truth.
# Do NOT overwrite /etc/apache2/sites-enabled/ocr.ruby.lease-le-ssl.conf
# with node -e writeFileSync — use this file and cp/a2ensite instead.

<VirtualHost *:443>
    ServerName ocr.ruby.lease
    DocumentRoot /var/www/catalogos/

    <Directory /var/www/catalogos>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 300

    # --- v59 production (Flask :5005) ---
    ProxyPass /caso/ http://localhost:5005/caso/
    ProxyPassReverse /caso/ http://localhost:5005/caso/
    ProxyPass /OCR/v59/api/ http://localhost:5005/api/
    ProxyPassReverse /OCR/v59/api/ http://localhost:5005/api/

    # --- v60 testing: Socket.io WebSocket (must be BEFORE /testing/v60/) ---
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{REQUEST_URI} ^/testing/v60/socket\.io
    RewriteRule ^/testing/v60/socket\.io/(.*)$ ws://127.0.0.1:5008/socket.io/ [P,L]
    ProxyPass /testing/v60/socket.io/ http://127.0.0.1:5008/socket.io/
    ProxyPassReverse /testing/v60/socket.io/ http://127.0.0.1:5008/socket.io/

    # --- v60 testing: Next.js frontend :3060 ---
    ProxyPass /testing/v60/ http://127.0.0.1:3060/testing/v60/
    ProxyPassReverse /testing/v60/ http://127.0.0.1:3060/testing/v60/

    # --- v60 testing: direct /api/ from browser ---
    ProxyPass /api/ http://127.0.0.1:5008/api/
    ProxyPassReverse /api/ http://127.0.0.1:5008/api/

    # Redirect root → v59 frontend
    RewriteRule ^/?$ /OCR/v59/frontend/ [R=301,L]

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/ocr.ruby.lease/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ocr.ruby.lease/privkey.pem
</VirtualHost>
