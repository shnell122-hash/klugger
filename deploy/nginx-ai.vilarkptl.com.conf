# Nginx virtual host config for ai.vilarkptl.com
# Place in: /etc/nginx/sites-available/ai.vilarkptl.com
# Enable: ln -s /etc/nginx/sites-available/ai.vilarkptl.com /etc/nginx/sites-enabled/
# SSL: certbot --nginx -d ai.vilarkptl.com

server {
    listen 80;
    server_name ai.vilarkptl.com;

    # Static frontend dashboard
    location / {
        root /var/www/html/vilarkptl.com/ai-monitor/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # REST API — proxy to Node.js
    location /api/ {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Socket.io WebSocket — requires upgrade headers
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}

